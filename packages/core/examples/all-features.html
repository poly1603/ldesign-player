<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>播放器全功能演示 - @ldesign/player-core</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
        }

        .player-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        #player-container {
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 16/9;
        }

        .controls-panel {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-height: 800px;
            overflow-y: auto;
        }

        .control-group {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .control-group:last-child {
            border-bottom: none;
        }

        .control-group h3 {
            font-size: 16px;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group h3::before {
            content: '';
            width: 4px;
            height: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }

        .btn {
            width: 100%;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 13px;
        }

        .info-box {
            background: #f8f9fa;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 13px;
            line-height: 1.6;
        }

        .info-box strong {
            color: #667eea;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-active {
            background: #4caf50;
        }

        .status-inactive {
            background: #9e9e9e;
        }

        .quality-selector {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 12px;
        }

        .stat-item {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        /* 手势控制指示器样式 */
        .gesture-indicator {
            position: fixed;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 16px 24px;
            border-radius: 8px;
            font-size: 18px;
            display: none;
            z-index: 10000;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 播放器全功能演示</h1>
            <p>展示所有高级功能：断点续播、速度记忆、画质切换、手势控制、迷你播放器等</p>
        </div>

        <div class="main-content">
            <!-- 播放器区域 -->
            <div class="player-section">
                <div id="player-container">
                    <video 
                        id="video-player"
                        controls
                        src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
                        style="width: 100%; height: 100%; object-fit: contain;"
                    ></video>
                </div>
            </div>

            <!-- 控制面板 -->
            <div class="controls-panel">
                <!-- 1. 断点续播 -->
                <div class="control-group">
                    <h3>⏯️ 断点续播</h3>
                    <div class="info-box">
                        <strong id="resume-status">未检测到断点</strong>
                    </div>
                    <button class="btn btn-primary" onclick="testResume()">恢复播放位置</button>
                    <button class="btn btn-secondary" onclick="clearResume()">清除断点</button>
                </div>

                <!-- 2. 播放速度 -->
                <div class="control-group">
                    <h3>💾 播放速度记忆</h3>
                    <div class="info-box">
                        当前速度: <strong id="current-speed">1.0x</strong>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-small btn-secondary" onclick="setSpeed(0.5)">0.5x</button>
                        <button class="btn btn-small btn-secondary" onclick="setSpeed(0.75)">0.75x</button>
                        <button class="btn btn-small btn-secondary" onclick="setSpeed(1.0)">1.0x</button>
                        <button class="btn btn-small btn-secondary" onclick="setSpeed(1.25)">1.25x</button>
                        <button class="btn btn-small btn-secondary" onclick="setSpeed(1.5)">1.5x</button>
                        <button class="btn btn-small btn-secondary" onclick="setSpeed(2.0)">2.0x</button>
                    </div>
                </div>

                <!-- 3. 画质切换 -->
                <div class="control-group">
                    <h3>📺 画质切换</h3>
                    <div class="info-box">
                        当前画质: <strong id="current-quality">原画</strong>
                    </div>
                    <div class="quality-selector">
                        <button class="btn btn-small btn-secondary" onclick="switchQuality('4k')">4K</button>
                        <button class="btn btn-small btn-secondary" onclick="switchQuality('1080p')">1080p</button>
                        <button class="btn btn-small btn-secondary" onclick="switchQuality('720p')">720p</button>
                        <button class="btn btn-small btn-secondary" onclick="switchQuality('480p')">480p</button>
                    </div>
                    <button class="btn btn-primary" onclick="autoQuality()" style="margin-top: 8px;">自动画质</button>
                </div>

                <!-- 4. 手势控制 -->
                <div class="control-group">
                    <h3>👆 手势控制</h3>
                    <div class="info-box">
                        <span class="status-indicator" id="gesture-status"></span>
                        <span id="gesture-text">未启用</span>
                    </div>
                    <button class="btn btn-primary" onclick="toggleGesture()">
                        <span id="gesture-btn-text">启用手势</span>
                    </button>
                    <div class="info-box" style="margin-top: 12px; font-size: 12px;">
                        • 双击：暂停/播放<br>
                        • 左右滑动：快进/快退<br>
                        • 上下滑动（左）：亮度<br>
                        • 上下滑动（右）：音量
                    </div>
                </div>

                <!-- 5. 迷你播放器 -->
                <div class="control-group">
                    <h3>🖼️ 迷你播放器</h3>
                    <div class="info-box">
                        <span class="status-indicator" id="mini-status"></span>
                        <span id="mini-text">未激活</span>
                    </div>
                    <button class="btn btn-primary" onclick="toggleMini()">
                        <span id="mini-btn-text">激活迷你模式</span>
                    </button>
                </div>

                <!-- 6. A-B 循环 -->
                <div class="control-group">
                    <h3>🔁 A-B 循环</h3>
                    <div class="info-box">
                        A点: <strong id="point-a">未设置</strong><br>
                        B点: <strong id="point-b">未设置</strong><br>
                        循环次数: <strong id="loop-count">0</strong>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-small btn-secondary" onclick="setPointA()">设置 A 点</button>
                        <button class="btn btn-small btn-secondary" onclick="setPointB()">设置 B 点</button>
                    </div>
                    <button class="btn btn-primary" onclick="toggleLoop()">
                        <span id="loop-btn-text">启用循环</span>
                    </button>
                    <button class="btn btn-secondary" onclick="clearLoop()">清除循环点</button>
                </div>

                <!-- 7. 播放统计 -->
                <div class="control-group">
                    <h3>📊 播放统计</h3>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-value" id="total-plays">0</div>
                            <div class="stat-label">总播放</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="total-time">0h</div>
                            <div class="stat-label">总时长</div>
                        </div>
                    </div>
                    <button class="btn btn-secondary" onclick="showStats()" style="margin-top: 12px;">查看详情</button>
                </div>

                <!-- 8. 离线缓存 -->
                <div class="control-group">
                    <h3>💾 离线缓存</h3>
                    <div class="info-box">
                        <span class="status-indicator" id="cache-status"></span>
                        <span id="cache-text">未缓存</span>
                    </div>
                    <button class="btn btn-primary" onclick="cacheVideo()">缓存当前视频</button>
                    <div class="info-box" id="cache-progress" style="display: none; margin-top: 12px;">
                        缓存进度: <strong id="cache-percent">0%</strong>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 手势指示器 -->
    <div class="gesture-indicator" id="gesture-indicator"></div>

    <script type="module">
        // 模拟导入（实际使用时从 npm 包导入）
        console.log('🎬 播放器全功能演示加载完成');
        
        // 初始化全局变量
        window.player = document.getElementById('video-player');
        window.trackId = 'demo-video-001';
        
        // 模拟功能状态
        window.resumeData = null;
        window.speedMemory = {};
        window.gestureEnabled = false;
        window.miniPlayerActive = false;
        window.loopEnabled = false;
        window.pointA = null;
        window.pointB = null;
        window.loopCount = 0;
        window.playHistory = [];
        window.cacheStatus = false;

        // 初始化
        function init() {
            // 加载断点
            const saved = localStorage.getItem('resume-demo-video-001');
            if (saved) {
                window.resumeData = JSON.parse(saved);
                document.getElementById('resume-status').textContent = 
                    `检测到断点: ${formatTime(window.resumeData.position)}`;
            }

            // 加载速度
            const savedSpeed = localStorage.getItem('speed-demo-video-001');
            if (savedSpeed) {
                const speed = parseFloat(savedSpeed);
                window.player.playbackRate = speed;
                document.getElementById('current-speed').textContent = speed + 'x';
            }

            // 加载播放历史
            const history = localStorage.getItem('play-history');
            if (history) {
                window.playHistory = JSON.parse(history);
                updateStats();
            }

            // 监听播放事件
            window.player.addEventListener('timeupdate', () => {
                // 自动保存断点
                if (window.player.currentTime > 10 && 
                    window.player.currentTime < window.player.duration - 10) {
                    window.resumeData = {
                        position: window.player.currentTime,
                        timestamp: new Date().toISOString()
                    };
                    localStorage.setItem('resume-demo-video-001', JSON.stringify(window.resumeData));
                }

                // A-B循环检测
                if (window.loopEnabled && window.pointB && window.player.currentTime >= window.pointB) {
                    window.player.currentTime = window.pointA || 0;
                    window.loopCount++;
                    document.getElementById('loop-count').textContent = window.loopCount;
                }
            });

            // 监听播放结束
            window.player.addEventListener('ended', () => {
                // 记录历史
                window.playHistory.push({
                    trackId: window.trackId,
                    duration: window.player.duration,
                    timestamp: new Date().toISOString()
                });
                localStorage.setItem('play-history', JSON.stringify(window.playHistory));
                updateStats();
            });
        }

        // 1. 断点续播
        window.testResume = function() {
            if (window.resumeData) {
                if (confirm(`从 ${formatTime(window.resumeData.position)} 继续播放？`)) {
                    window.player.currentTime = window.resumeData.position;
                    window.player.play();
                }
            } else {
                alert('没有检测到断点');
            }
        };

        window.clearResume = function() {
            localStorage.removeItem('resume-demo-video-001');
            window.resumeData = null;
            document.getElementById('resume-status').textContent = '未检测到断点';
            alert('断点已清除');
        };

        // 2. 播放速度
        window.setSpeed = function(speed) {
            window.player.playbackRate = speed;
            document.getElementById('current-speed').textContent = speed + 'x';
            localStorage.setItem('speed-demo-video-001', speed);
            showToast(`播放速度已设置为 ${speed}x`);
        };

        // 3. 画质切换
        window.switchQuality = function(quality) {
            const labels = {
                '4k': '4K',
                '1080p': '1080p',
                '720p': '720p',
                '480p': '480p'
            };
            document.getElementById('current-quality').textContent = labels[quality];
            showToast(`已切换到 ${labels[quality]} 画质`);
        };

        window.autoQuality = function() {
            // 模拟自动选择
            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            let quality = '720p';
            
            if (connection) {
                const type = connection.effectiveType;
                if (type === '4g') quality = '1080p';
                else if (type === '3g') quality = '480p';
            }
            
            switchQuality(quality);
            showToast('已根据网速自动选择画质');
        };

        // 4. 手势控制
        window.toggleGesture = function() {
            window.gestureEnabled = !window.gestureEnabled;
            const status = document.getElementById('gesture-status');
            const text = document.getElementById('gesture-text');
            const btnText = document.getElementById('gesture-btn-text');
            
            if (window.gestureEnabled) {
                status.className = 'status-indicator status-active';
                text.textContent = '已启用（在播放器上滑动试试）';
                btnText.textContent = '停用手势';
                enableGestures();
                showToast('手势控制已启用');
            } else {
                status.className = 'status-indicator status-inactive';
                text.textContent = '未启用';
                btnText.textContent = '启用手势';
                disableGestures();
                showToast('手势控制已停用');
            }
        };

        function enableGestures() {
            const container = document.getElementById('player-container');
            let touchStartX = 0;
            let touchStartY = 0;
            let lastTapTime = 0;

            window.gestureHandlers = {
                touchstart: (e) => {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                },
                touchmove: (e) => {
                    const deltaX = e.touches[0].clientX - touchStartX;
                    const deltaY = e.touches[0].clientY - touchStartY;
                    
                    if (Math.abs(deltaX) > 50) {
                        showGestureIndicator(deltaX > 0 ? '快进 →' : '← 快退');
                    } else if (Math.abs(deltaY) > 50) {
                        const isLeft = touchStartX < container.offsetWidth / 2;
                        showGestureIndicator(isLeft ? '☀️ 亮度' : '🔊 音量');
                    }
                },
                touchend: (e) => {
                    const now = Date.now();
                    if (now - lastTapTime < 300) {
                        if (window.player.paused) {
                            window.player.play();
                            showToast('▶️ 播放');
                        } else {
                            window.player.pause();
                            showToast('⏸️ 暂停');
                        }
                    }
                    lastTapTime = now;
                    hideGestureIndicator();
                }
            };

            container.addEventListener('touchstart', window.gestureHandlers.touchstart);
            container.addEventListener('touchmove', window.gestureHandlers.touchmove);
            container.addEventListener('touchend', window.gestureHandlers.touchend);
        }

        function disableGestures() {
            if (window.gestureHandlers) {
                const container = document.getElementById('player-container');
                container.removeEventListener('touchstart', window.gestureHandlers.touchstart);
                container.removeEventListener('touchmove', window.gestureHandlers.touchmove);
                container.removeEventListener('touchend', window.gestureHandlers.touchend);
            }
        }

        function showGestureIndicator(text) {
            const indicator = document.getElementById('gesture-indicator');
            indicator.textContent = text;
            indicator.style.display = 'block';
            indicator.style.left = '50%';
            indicator.style.top = '50%';
            indicator.style.transform = 'translate(-50%, -50%)';
        }

        function hideGestureIndicator() {
            setTimeout(() => {
                document.getElementById('gesture-indicator').style.display = 'none';
            }, 500);
        }

        // 5. 迷你播放器
        window.toggleMini = function() {
            window.miniPlayerActive = !window.miniPlayerActive;
            const status = document.getElementById('mini-status');
            const text = document.getElementById('mini-text');
            const btnText = document.getElementById('mini-btn-text');
            
            if (window.miniPlayerActive) {
                status.className = 'status-indicator status-active';
                text.textContent = '已激活';
                btnText.textContent = '退出迷你模式';
                showToast('迷你播放器已激活');
                alert('迷你播放器功能需要完整实现。\n演示版本：将在右下角显示浮动窗口。');
            } else {
                status.className = 'status-indicator status-inactive';
                text.textContent = '未激活';
                btnText.textContent = '激活迷你模式';
                showToast('迷你播放器已停用');
            }
        };

        // 6. A-B循环
        window.setPointA = function() {
            window.pointA = window.player.currentTime;
            document.getElementById('point-a').textContent = formatTime(window.pointA);
            showToast(`A点已设置: ${formatTime(window.pointA)}`);
        };

        window.setPointB = function() {
            window.pointB = window.player.currentTime;
            document.getElementById('point-b').textContent = formatTime(window.pointB);
            showToast(`B点已设置: ${formatTime(window.pointB)}`);
        };

        window.toggleLoop = function() {
            if (!window.pointA || !window.pointB) {
                alert('请先设置 A 点和 B 点');
                return;
            }
            
            window.loopEnabled = !window.loopEnabled;
            const btnText = document.getElementById('loop-btn-text');
            
            if (window.loopEnabled) {
                btnText.textContent = '停用循环';
                window.loopCount = 0;
                document.getElementById('loop-count').textContent = '0';
                window.player.currentTime = window.pointA;
                window.player.play();
                showToast('A-B循环已启用');
            } else {
                btnText.textContent = '启用循环';
                showToast('A-B循环已停用');
            }
        };

        window.clearLoop = function() {
            window.pointA = null;
            window.pointB = null;
            window.loopEnabled = false;
            window.loopCount = 0;
            document.getElementById('point-a').textContent = '未设置';
            document.getElementById('point-b').textContent = '未设置';
            document.getElementById('loop-count').textContent = '0';
            document.getElementById('loop-btn-text').textContent = '启用循环';
            showToast('循环点已清除');
        };

        // 7. 播放统计
        window.showStats = function() {
            const stats = window.playHistory;
            const totalPlays = stats.length;
            const totalTime = stats.reduce((sum, item) => sum + (item.duration || 0), 0);
            
            alert(`播放统计：\n` +
                  `总播放次数: ${totalPlays}\n` +
                  `总播放时长: ${formatTime(totalTime)}\n` +
                  `平均时长: ${formatTime(totalTime / Math.max(totalPlays, 1))}`);
        };

        function updateStats() {
            const totalPlays = window.playHistory.length;
            const totalTime = window.playHistory.reduce((sum, item) => sum + (item.duration || 0), 0);
            
            document.getElementById('total-plays').textContent = totalPlays;
            document.getElementById('total-time').textContent = Math.floor(totalTime / 3600) + 'h';
        }

        // 8. 离线缓存
        window.cacheVideo = function() {
            const status = document.getElementById('cache-status');
            const text = document.getElementById('cache-text');
            const progress = document.getElementById('cache-progress');
            const percent = document.getElementById('cache-percent');
            
            progress.style.display = 'block';
            status.className = 'status-indicator status-active';
            text.textContent = '缓存中...';
            
            let p = 0;
            const timer = setInterval(() => {
                p += 10;
                percent.textContent = p + '%';
                
                if (p >= 100) {
                    clearInterval(timer);
                    text.textContent = '已缓存';
                    window.cacheStatus = true;
                    showToast('视频缓存完成');
                    setTimeout(() => {
                        progress.style.display = 'none';
                    }, 2000);
                }
            }, 200);
        };

        // 工具函数
        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            
            if (h > 0) {
                return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }
            return `${m}:${String(s).padStart(2, '0')}`;
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.textContent = message;
            toast.style.cssText = `
                position: fixed;
                bottom: 30px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0, 0, 0, 0.8);
                color: white;
                padding: 12px 24px;
                border-radius: 6px;
                font-size: 14px;
                z-index: 10001;
                animation: fadeInOut 2s;
            `;
            
            const style = document.createElement('style');
            style.textContent = `
                @keyframes fadeInOut {
                    0%, 100% { opacity: 0; }
                    10%, 90% { opacity: 1; }
                }
            `;
            document.head.appendChild(style);
            
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        // 页面加载完成后初始化
        init();
    </script>
</body>
</html>
